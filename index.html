<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ thống Quản lý Lớp học QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; background: #2c3e50; color: white; text-align: center; padding: 15px 0; font-size: 18px; font-weight: bold; }
        /* 3 Nút Chọn Chế Độ */
        .mode-container { display: flex; justify-content: space-around; width: 100%; max-width: 500px; padding: 10px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-mode { flex: 1; margin: 0 5px; padding: 12px 5px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; color: white; cursor: pointer; opacity: 0.4; transition: 0.3s; }
        .btn-mode.active { opacity: 1; transform: scale(1.05); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        #btn-diemdanh { background-color: #3498db; }
        #btn-phatbieu { background-color: #2ecc71; }
        #btn-vipham { background-color: #e74c3c; }
        /* Camera Area */
        #reader { width: 100%; max-width: 500px; margin-top: 10px; border-radius: 10px; overflow: hidden; background: #000; }
        /* Danh sách đã quét */
        .list-container { width: 90%; max-width: 500px; margin-top: 15px; background: white; border-radius: 10px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-grow: 1; overflow-y: auto; max-height: 250px;}
        .list-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; font-size: 15px; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; }
        .badge-diemdanh { background: #3498db; }
        .badge-phatbieu { background: #2ecc71; }
        .badge-vipham { background: #e74c3c; }
        /* Nút Đồng Bộ & In QR */
        .action-btns { display: flex; width: 90%; max-width: 500px; gap: 10px; margin: 15px 0; }
        .btn-sync { flex: 2; padding: 15px; border: none; border-radius: 8px; background: #f39c12; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-print { flex: 1; padding: 15px; border: none; border-radius: 8px; background: #7f8c8d; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">📋 TRỢ LÝ LỚP HỌC</div>
    
    <div class="mode-container">
        <button id="btn-diemdanh" class="btn-mode active" onclick="setMode('Có mặt', 'btn-diemdanh')">📌 Điểm danh</button>
        <button id="btn-phatbieu" class="btn-mode" onclick="setMode('Phát biểu', 'btn-phatbieu')">⭐ Phát biểu</button>
        <button id="btn-vipham" class="btn-mode" onclick="setMode('Chưa chú ý', 'btn-vipham')">⚠️ Chưa chú ý</button>
    </div>
    
    <div id="reader"></div>
    
    <div class="action-btns">
        <button class="btn-sync" onclick="syncData()">⬆️ Đồng bộ lên Sheet</button>
        <button class="btn-print" onclick="printQR()">🖨️ In mã QR</button>
    </div>
    
    <div class="list-container" id="scannedList">
        <div style="text-align: center; color: #7f8c8d; font-size: 13px;">Danh sách quét sẽ hiện ở đây...</div>
    </div>
    
    <audio id="beepSound" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>
    <form id="hiddenForm" method="POST" target="hidden_iframe" style="display:none;">
        <input type="text" name="data" id="payloadInput">
    </form>
    <iframe name="hidden_iframe" style="display:none;" onload="iframeLoaded()"></iframe>
    
    <script>
        // TẠM THỜI ĐỂ TRỐNG LINK APP SCRIPT, CHÚNG TA SẼ DÁN SAU
        const GAS_URL = "DÁN_LINK_APPS_SCRIPT_CỦA_THẦY_VÀO_ĐÂY";

        let currentMode = "Có mặt";
        let records = []; 
        let lastScanTime = {}; 
        let isSubmitting = false;

        function setMode(modeName, btnId) {
            currentMode = modeName;
            document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
            document.getElementById(btnId).classList.add('active');
        }

        function onScanSuccess(decodedText, decodedResult) {
            let now = Date.now();
            if (lastScanTime[decodedText] && (now - lastScanTime[decodedText] < 3000)) return; 
            lastScanTime[decodedText] = now;
            document.getElementById('beepSound').play().catch(e => {});
            records.push({ maHS: decodedText, trangThai: currentMode });
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('scannedList');
            if(records.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #7f8c8d; font-size: 13px;">Danh sách quét sẽ hiện ở đây...</div>';
                return;
            }
            let html = '';
            for(let i = records.length - 1; i >= 0; i--) {
                let badgeClass = records[i].trangThai === 'Có mặt' ? 'badge-diemdanh' : 
                                 (records[i].trangThai === 'Phát biểu' ? 'badge-phatbieu' : 'badge-vipham');
                html += `<div class="list-item">
                            <span><b>${records[i].maHS}</b></span>
                            <span class="badge ${badgeClass}">${records[i].trangThai}</span>
                         </div>`;
            }
            list.innerHTML = html;
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 15, 
            qrbox: function(windowWidth, windowHeight) {
                var size = Math.min(windowWidth, windowHeight) * 0.85;
                return { width: size, height: size };
            },
            videoConstraints: { facingMode: "environment", focusMode: "continuous" }
        }, false);
        html5QrcodeScanner.render(onScanSuccess);

        function syncData() {
            if (records.length === 0) { alert("Chưa có học sinh nào được quét!"); return; }
            if (!GAS_URL || GAS_URL.includes("DÁN_LINK")) { alert("Thầy chưa dán link Google Apps Script vào file Code!"); return; }
            
            document.querySelector('.btn-sync').innerText = "⏳ Đang đồng bộ...";
            isSubmitting = true;
            document.getElementById('payloadInput').value = JSON.stringify(records);
            
            let form = document.getElementById('hiddenForm');
            form.action = GAS_URL;
            form.submit();
        }

        function iframeLoaded() {
            if(isSubmitting) {
                alert("✅ Đồng bộ thành công " + records.length + " lượt!");
                records = []; 
                updateUI();
                document.querySelector('.btn-sync').innerText = "⬆️ Đồng bộ lên Sheet";
                isSubmitting = false;
            }
        }

        function printQR() {
            if (!GAS_URL || GAS_URL.includes("DÁN_LINK")) { alert("Vui lòng cấu hình link Apps Script trước khi in QR."); return; }
            window.open(GAS_URL + "?action=inQR", "_blank");
        }
    </script>
</body>
</html>
